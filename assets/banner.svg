<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="Elias Antezana, Developer y Data Engineering" xmlns:c2pa="http://c2pa.org/manifest">
<style>
.p { animation: sort 9s cubic-bezier(.65,0,.35,1) infinite; }
@keyframes sort {
  0%   { transform: translate(var(--dx), var(--dy)); opacity: .35; }
  30%  { transform: translate(var(--dx), var(--dy)); opacity: .35; }
  58%  { transform: translate(0,0); opacity: 1; }
  88%  { transform: translate(0,0); opacity: 1; }
  100% { transform: translate(var(--dx), var(--dy)); opacity: .35; }
}
.n { font: 800 64px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #e6edf3; }
.s { font: 500 26px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #6cc6b6; }
.t { font: 400 19px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #8b949e; }
@media (prefers-reduced-motion: reduce) { .p { animation: none; } }
</style>
