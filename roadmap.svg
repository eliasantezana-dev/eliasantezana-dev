<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 230" width="1200" height="230" role="img" aria-label="Evolución: Software Development, Data Engineering, AI Engineering" xmlns:c2pa="http://c2pa.org/manifest">
<defs>
<linearGradient id="ln" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2dd4bf"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
</defs>
<style>
.h{font:700 25px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#f1f5f9}
.d{font:400 20px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#94a3b8}
.k{font:600 19px 'Segoe UI',Helvetica,Arial,sans-serif}
.pulse{transform-box:fill-box;transform-origin:center;animation:pl 2.4s ease-out infinite}
@keyframes pl{0%{transform:scale(1);opacity:.7}100%{transform:scale(2.4);opacity:0}}
@media (prefers-reduced-motion:reduce){.pulse{animation:none;opacity:0}}
</style>
<rect width="1200" height="230" rx="14" fill="#0b1020"/>
<rect x="170" y="62" width="860" height="4" rx="2" fill="url(#ln)" opacity=".5"/>
<rect x="170" y="62" width="430" height="4" rx="2" fill="url(#ln)"/>
 
<circle cx="170" cy="64" r="13" fill="#2dd4bf"/>
<text class="k" x="170" y="35" text-anchor="middle" fill="#2dd4bf">Base</text>
<text class="h" x="170" y="125" text-anchor="middle">Software &amp; Data</text>
<text class="d" x="170" y="158" text-anchor="middle">.NET · Angular · Python</text>
<text class="d" x="170" y="186" text-anchor="middle">SQL · Power BI</text>
 
<circle class="pulse" cx="600" cy="64" r="13" fill="#2dd4bf"/>
<circle cx="600" cy="64" r="13" fill="#0b1020" stroke="#2dd4bf" stroke-width="4"/>
<circle cx="600" cy="64" r="5" fill="#2dd4bf"/>
<text class="k" x="600" y="35" text-anchor="middle" fill="#2dd4bf">Ahora</text>
<text class="h" x="600" y="125" text-anchor="middle">Data Engineering</text>
<text class="d" x="600" y="158" text-anchor="middle">Pipelines ETL · Modelado</text>
<text class="d" x="600" y="186" text-anchor="middle">Orquestación · Cloud</text>
 
<circle cx="1030" cy="64" r="13" fill="#0b1020" stroke="#a78bfa" stroke-width="4" stroke-dasharray="5 4"/>
<text class="k" x="1030" y="35" text-anchor="middle" fill="#a78bfa">Siguiente</text>
<text class="h" x="1030" y="125" text-anchor="middle">AI Engineering</text>
<text class="d" x="1030" y="158" text-anchor="middle">ML aplicado · LLMs</text>
<text class="d" x="1030" y="186" text-anchor="middle">Datos para IA · MLOps</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
